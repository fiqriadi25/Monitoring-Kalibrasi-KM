      --primary: #0f7a4d;
      --primary-dark: #0b5d3a;
      --primary-light: #e8f6ef;
      --navy: #0d1b2e;
      --navy-2: #132441;
      --bg: #f4f6fa;
      --card: #ffffff;
      --text: #1f2b3d;
      --muted: #67748a;
      --border: #e5eaf1;
      --sidebar-width: 248px;
      --radius: 16px;
      --shadow-sm: 0 1px 3px rgba(13, 27, 46, .05);
      --shadow-md: 0 8px 24px rgba(13, 27, 46, .08);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(1200px 500px at 85% -10%, rgba(15, 122, 77, .07), transparent 60%),
        var(--bg);
      color: var(--text);
      font-family:
        "Segoe UI",
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        sans-serif;
      font-size: 14px;
    }

    ::selection {
      background: rgba(15, 122, 77, .18);
    }

    .app-sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: var(--sidebar-width);
      background: linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%);
      color: white;
      z-index: 1020;
      display: flex;
      flex-direction: column;
    }

    .brand {
      min-height: 78px;
      display: flex;

    body:not(.app-authenticated):not(.app-session-restoring) #sidebarBackdrop {
      display: none !important;
    }

    #loginView {
      position: fixed;
      inset: 0;
      width: 100%;
      max-width: 100vw;
      z-index: 1040;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: auto;
      background:
        radial-gradient(900px 520px at 12% 8%, rgba(23, 166, 115, .18), transparent 62%),
        radial-gradient(700px 420px at 96% 96%, rgba(47, 94, 159, .16), transparent 62%),
        linear-gradient(135deg, #071322 0%, #0d2137 52%, #102c3f 100%);
    }

    body.app-authenticated #loginView,
    body.app-session-restoring #loginView { display: none; }

    .session-restore-state {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 2050;
      display: none;
      align-items: center;
      gap: 10px;
      max-width: calc(100vw - 32px);
      padding: 12px 16px;
      border: 1px solid #cfe6da;
      border-radius: 14px;
      background: rgba(255,255,255,.96);
      color: #29483e;
      box-shadow: 0 10px 34px rgba(19,56,43,.13);
      font-size: 12px;
      font-weight: 650;
    }
    body.app-session-restoring .session-restore-state { display: flex; }
    body.app-authenticated .session-restore-state { display: none; }
    body.app-session-restoring .app-sidebar,
    body.app-session-restoring .app-main { pointer-events: none; }
    body.app-session-restoring .app-main { opacity: .82; }

    .login-shell {
      width: min(980px, 100%);
      max-width: 100%;
      min-width: 0;
      min-height: 590px;
      display: grid;
      grid-template-columns: 1.04fr .96fr;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 26px;
      background: #fff;
      box-shadow: 0 30px 90px rgba(0, 0, 0, .32);
    }

    .login-brand-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(540px 300px at 8% 8%, rgba(20, 168, 107, .2), transparent 62%),
        linear-gradient(115deg, rgba(3, 14, 25, .14), transparent 55%);
      box-shadow: inset 0 0 72px rgba(2, 12, 21, .14);
    }

    .login-brand-panel::after {
      content: "";
      position: absolute;
      inset: auto 42px 30px;
      z-index: 0;
      height: 1px;
      pointer-events: none;
      background: linear-gradient(90deg, rgba(255,255,255,.2), transparent 75%);
    }

    .login-brand-top,
    .login-brand-bottom { position: relative; z-index: 2; }

    .login-logo {
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 17px;
      background: linear-gradient(145deg, #20b87d, #087a55);
      font-size: 16px;
      font-weight: 900;
      box-shadow: 0 12px 30px rgba(2, 12, 21, .38);
    }

    .login-brand-panel h1 {
      max-width: 420px;
      margin: 26px 0 10px;
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 850;
      line-height: 1.08;
      letter-spacing: -.035em;
      text-shadow: 0 3px 18px rgba(0, 0, 0, .34);
    }

    .login-brand-panel p {
      max-width: 440px;
      margin: 0;
      color: rgba(255,255,255,.86);
      font-size: 13px;
      line-height: 1.75;
      text-shadow: 0 2px 12px rgba(0, 0, 0, .36);
    }

    .login-security-list {
      display: grid;
      gap: 10px;
      margin-top: 28px;
    }

    .login-security-item {
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(255,255,255,.72);
      font-size: 11px;
      font-weight: 650;
    }

    .login-security-dot {
      width: 22px;
      height: 22px;
